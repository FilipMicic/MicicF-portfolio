<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
        <link rel="stylesheet" href="../css/style.css">
        <link rel="stylesheet" href="css/droper.css">
        <title>
            Falling Sky - Filip Micic
        </title>
        
    </head>

    <body class="body">
        <div class="scroll-progress" id="scroll-progress"></div>
        <header class="header">
            <div class="header-content">
                <a href="../index.html" class="logo">
                   <img src="../slike/logo.png" alt="Mićić">
                </a>

                <nav class="navigation">
                <a href="../index.html">Početna</a>
                <a href="../omeni.html">O meni</a>
                <a href="../aplikacije.html">Aplikacije</a>
                <a href="../kontakt.html">Kontakt</a>
            </nav>
            <div class="user-menu" id="user-menu">
                        <!--logout ovan-->
                    
                        <a class="login" id="loginLink" href="../login.html"><i class="fas fa-user"></i></a>

                        <!--Loginovan-->

                        <button class="login profile-toggle" id="profileToggle" type="button" hidden>
                        <i class="fas fa-user"></i>
                        </button>    


                     <div class="user-dropdown" id="userDropdown" hidden>
                        <div class="user-avatar">
                            <i class="fas fa-user-circle"></i>
                        </div>

                        <h3 class="username-container">
                            <span id="userName">Korisnik</span>
                            <span class="admin-badge" id="adminBadge" hidden>Admin</span>
                        </h3>
                        <p id="userEmail">email@example.com</p>

                        <div class="dropdown-divider"></div>



                        <button class="logout" id="logoutButton" type="button">
                            <i class="fas fa-sign-out-alt"></i> 
                            Odjavi se
                        </button>
                     </div>
            </div>
        </header>

        <main>
            <div class="game-container">
                <canvas id="gameCanvas" width="900" height="500"></canvas>

                <div class="game-overlay" id="gameOverlay">
                    <div class="overlay-content">

                        <div class="overlay-decoration">
                            <i class="fas fa-star"></i>
                            <i class="fas fa-cloud"></i>
                            <i class="fas fa-sun"></i>    
                        </div>

                        <p class="overlay-small">MICICF PRESENTS</p>

                        <h1 id="overlayTitle">FALLING SKY</h1>

                        <div class="overlay-line"></div>
                        
                        <p id="overlay-description">
                            Uhvati što više zvezdica možete!
                        </p>

                        <button class="overlay-button" id="startButton"><i class="fas fa-play"></i> ZAPOČNI IGRU</button>

                        <div class="controls-info">
                            <span class="control-key">
                                <i class="fas fa-arrow-left"></i>
                            </span>
                            <span>POMERANJE</span>
                            <span class="control-key">
                                <i class="fas fa-arrow-right"></i>
                            </span>

                            
                        </div>
                    </div>
                </div>


                <div class="game-hud">
                    <div class="hud-item score-box">
                        <div class="hud-icon">
                            <i class="fas fa-star"></i>
                        </div>

                        <div class="hud-info">
                            <span class="hud-label">REZULTAT</span>
                            <span class="hud-value" id="score">0</span>
                        </div>
                    </div>

                    <div class="hud-item misses-box">
                        <span class="hud-label">PROMAŠAJI</span>

                        <div class="misses-icons">
                            <i class="fas fa-cloud"></i>
                            <i class="fas fa-cloud"></i>
                            <i class="fas fa-cloud"></i>
                        </div>

                        <span class="misses-count" id="misses">0</span>    

                    </div>

                </div>



            </div>
          
            
        </main>

        <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
        <script src="../js/supabase.js"></script>
            
            
        <script src="js/droper.js"></script>
        <script src="../js/script.js"></script>
        <script src="../js/profile.js"></script>
            

    </body>
</html>
