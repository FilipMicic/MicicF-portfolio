<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
        <link rel="stylesheet" href="../css/style.css">
        <link rel="stylesheet" href="css/droper.css">
        <title>
            Falling Sky - Filip Micic
        </title>
        
    </head>

    <body class="body">
        <div class="scroll-progress" id="scroll-progress"></div>
        <header class="header">
            <div class="header-content">
                <a href="../index.html" class="logo">
                   <img src="../slike/logo.png" alt="Mićić">
                </a>

                <nav class="navigation">
                <a href="../index.html">Početna</a>
                <a href="../omeni.html">O meni</a>
                <a href="../aplikacije.html">Aplikacije</a>
                <a href="../kontakt.html">Kontakt</a>
            </nav>
            <div class="user-menu" id="user-menu">
                        <!--logout ovan-->
                    
                        <a class="login" id="loginLink" href="../login.html"><i class="fas fa-user"></i></a>

                        <!--Loginovan-->

                        <button class="login profile-toggle" id="profileToggle" type="button" hidden>
                        <i class="fas fa-user"></i>
                        </button>    


                     <div class="user-dropdown" id="userDropdown" hidden>
                        <div class="user-avatar">
                            <i class="fas fa-user-circle"></i>
                        </div>

                        <h3 id="userName">Korisnik</h3>
                        <p id="userEmail">email@example.com</p>

                        <div class="dropdown-divider"></div>



                        <button class="logout" id="logoutButton" type="button">
                            <i class="fas fa-sign-out-alt"></i> 
                            Odjavi se
                        </button>
                     </div>
            </div>
        </header>

        <main>
            <div class="game-container">
                <canvas id="gameCanvas" width="900" height="500"></canvas>

                <div class="game-overlay" id="gameOverlay">
                    <div class="overlay-content">
                        <p class="overlay-small">MICICF</p>
                        <h1 id="overlayTitle">DROPER</h1>
                        <p id="overlay-description">Uhvatite što više loptica možete</p>

                        <button id="startButton">ZAPOČNI IGRU</button>

                        <p class="controls-info">
                            <i class="fa solid fa-arrow-left"></i>
                            Pomeranje
                            <i class="fa solid fa-arrow-right"></i>
                        </p>
                    </div>
                 </div>


                 <div class="game-hud">
                    <div class="hud-item">
                        POENI: <span id="score">0</span>
                    </div>

                    <div class="hud-item">
                        PROMAŠAJI: <span id="misses">0</span>/3
                    </div>
                 </div>
            </div>
          
            
        </main>

        <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
        <script src="../js/supabase.js"></script>
            
            
        <script src="js/droper.js"></script>
        <script src="../js/script.js"></script>
        <script src="../js/profile.js"></script>
            

    </body>
</html>
