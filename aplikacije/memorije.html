<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="../css/style.css">
        <link rel="stylesheet" href="css/memorije.css">
        <title>
            Memorije - Filip Micic
        </title>

       
    </head>

     

    <body class="body">
        <div class="scroll-progress" id="scroll-progress"></div>
        <header class="header">
            <div class="header-content">
                <a href="../index.html" class="logo">
                   <img src="../slike/logo.png" alt="Mićić">
                </a>

                <nav class="navigation">
                <a href="../index.html">Početna</a>
                <a href="../omeni.html">O meni</a>
                <a href="../aplikacije.html">Aplikacije</a>
                <a href="../kontakt.html">Kontakt</a>
            </nav>
            <div class="user-menu" id="user-menu">
                        <!--logout ovan-->
                    
                        <a class="login" id="loginLink" href="../login.html"><i class="fas fa-user"></i></a>

                        <!--Loginovan-->

                        <button class="login profile-toggle" id="profileToggle" type="button" hidden>
                        <i class="fas fa-user"></i>
                        </button>    


                     <div class="user-dropdown" id="userDropdown" hidden>
                        <div class="user-avatar">
                            <i class="fas fa-user-circle"></i>
                        </div>

                        <h3 class="username-container">
                            <span id="userName">Korisnik</span>
                            <span class="admin-badge" id="adminBadge" hidden>Admin</span>
                        </h3>
                        <p id="userEmail">email@example.com</p>

                        <div class="dropdown-divider"></div>



                        <button class="logout" id="logoutButton" type="button">
                            <i class="fas fa-sign-out-alt"></i> 
                            Odjavi se
                        </button>
                     </div>
            </div>
        </header>

        <main>
         <div class="game">

            <div class="memorycontainer">
            <h1>MEMORIJA</h1>

            <div class="game-info">
                    <p>Potezi: <span id="move-count">0</span></p>
                    <p>Pronadjeno: <span id="found-count">0</span>/9</p>
            </div>

            <div class="game-board" id="game-board">
                <!-- Kartice će biti generisane ovde -->

            </div>

            <button id="restart">Pocni ponovo</button>

            <p id="gameMessages"></p>
         </div>
         </div>
         
        </main>

        <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
        <script src="../js/supabase.js"></script>
            
            
        <script src="js/memorije.js"></script>
        <script src="../js/script.js"></script>
        <script src="../js/profile.js"></script>
            
    </body>
</html>
