    <!DOCTYPE html>
    <html>
        <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">

            <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
            <link rel="stylesheet" href="css/style.css">
            <link rel="stylesheet" href="css/kontakt.css">

            <title>
                Kontakt - Filip Micic
            </title>
        </head>

        <body class="body">
            <div class="scroll-progress" id="scroll-progress"></div>
            <header class="header">
                <div class="header-content">
                    <a href="index.html" class="logo">
                    <img src="slike/logo.png" alt="Mićić">
                    </a>

                    <nav class="navigation">
                    <a href="index.html">Početna</a>
                    <a href="omeni.html">O meni</a>
                    <a href="aplikacije.html">Aplikacije</a>
                    <a href="kontakt.html">Kontakt</a>
                </nav>
                <div class="user-menu" id="user-menu">
                        <!--logout ovan-->
                    
                        <a class="login" id="loginLink" href="login.html"><i class="fas fa-user"></i></a>

                        <!--Loginovan-->

                        <button class="login profile-toggle" id="profileToggle" type="button" hidden>
                        <i class="fas fa-user"></i>
                        </button>    


                     <div class="user-dropdown" id="userDropdown" hidden>
                        <div class="user-avatar">
                            <i class="fas fa-user-circle"></i>
                        </div>

                        <h3 class="username-container">
                            <span id="userName">Korisnik</span>
                            <span class="admin-badge" id="adminBadge" hidden>Admin</span>
                        </h3>
                        <p id="userEmail">email@example.com</p>

                        <div class="dropdown-divider"></div>



                        <button class="logout" id="logoutButton" type="button">
                            <i class="fas fa-sign-out-alt"></i> 
                            Odjavi se
                        </button>
                     </div>
                </div>
            </header>

            <main>
        
            <div class="backlay">
                <div class="contact-title">KONTAKT</div>
                <div class="contant-content">
                    <div class="contact-info">
                        <a href="mailto:filipfilip.micic1@gmail.com" class="contact-link"><i class="fas fa-envelope"></i> Email: filipfilip.micic1@gmail.com</a>
                        <a href="tel:+381691508692" class="contact-link"><i class="fas fa-phone"></i> Telefon: +381691508692</a>
                        <a href="https://www.linkedin.com/in/filip-micic-109636451/" target="_blank" class="contact-link"><i class="fab fa-linkedin"></i> LinkedIn</a>
                        <a href="https://github.com/FilipMicic" target="_blank" class="contact-link"><i class="fab fa-github"></i> GitHub</a>
                        <a href="https://www.instagram.com/micicc_f" target="_blank" class="contact-link"><i class="fab fa-instagram"></i> Instagram</a>
                    </div>

        
                    
                    <div class="contact-form">

                        <h2>Pošaljite poruku</h2>
                        <p class="form-description">Popunite obrazac ispod kako biste me kontaktirali.</p>
                        <form action="https://formspree.io/f/xljbwbeo" method="post">

                            <div class="form-group">
                                <label for="name">Ime:</label>
                                <input type="text" id="name" name="name" required>
                            </div>

                            <div class="form-group">
                                <label for="email">Email:</label>
                                <input type="email" id="email" name="email" required>
                            </div>

                            <div class="form-group">
                                <label for="message">Poruka:</label>
                                <textarea id="message" name="message" required></textarea>
                            </div>

                            <button type="submit">Pošalji <i class="fa-solid fa-paper-plane"></i></button>
                        </form>
                        <div id="form-response" class="form-response">
                            <i class="fas fa-check-circle"></i> 
                            Hvala na poruci! Odgovorićemo uskoro.

                        </div>
                    </div>
                </div>
            </div>

            
            </main>

            <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
            <script src="js/supabase.js"></script>
            
            <script src="js/kontakt.js"></script>
            <script src="js/script.js"></script>
            <script src="js/profile.js"></script>
        </body>
    </html>
