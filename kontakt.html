    <!DOCTYPE html>
    <html>
        <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">

            <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

            <title>
                Filip Micic
            </title>
            <style>
                *
                {
                    margin: 0;
                    padding: 0;
                    box-sizing: border-box;
                }

                .body
                {
                    background-color: #080808;

                        background-image:
                        radial-gradient(
                            ellipse at 15% 20%,
                            rgba(100, 0, 15, 0.25),
                            transparent 40%
                        ),
                        radial-gradient(
                            ellipse at 85% 80%,
                            rgba(75, 0, 10, 0.2),
                            transparent 40%
                        );

                        min-height: 100vh;
                }

                .header 
                {
                    width: 100%;
                    height: 85px;

                    background: linear-gradient(90deg, #080808 ,#150909, #080808);

                    position: relative;
                    z-index: 10;

                    border-bottom: 1px solid #8c23234d;

                    box-shadow: 0 5px 25px rgba(0, 0, 0, 0.4);
                }
                .header-content
                {
                    max-width: 1200px;
                    height: 100%;
                    margin: 0 auto;
                    padding: 0 20px;

                    display: flex;
                    align-items: center;
                    justify-content: space-between;
                }

                .logo
                {
                    position: absolute;
                    top:5px;
                    left: max(5px, calc((100%-1230px)/2));

                    width: 90px;
                    height: 120px;

                    display: block;
                    z-index: 20;


                }
                .logo img {
                    width: 100%;
                    height: 100%;
                    object-fit: contain;
                    display: block;
                }
                
                .navigation
                {
                    display: flex;
                    align-items: center;
                    gap: 45px;
                    margin-left: auto;
                }

                .navigation a
                {
                    position: relative;

                    text-decoration: none;
                    color: #bdb5b5;

                    font-size: 14px;
                    font-weight: 500;
                    letter-spacing: 0.5px;

                    padding: 10px 0;

                    background: transparent;

                    transition: color 0.3s ease;
                }

                .navigation a::after
                {
                    content: '';

                    position: absolute;
                    left: 0;
                    bottom: 0;

                    width: 100%;
                    height: 2px;

                    background: #a52b2b;
                    border-radius: 5px;
                    
                    transition: transform 0.3s ease;
                }

                .navigation a:hover, .navigation a.active
                {
                    
                    color: #ffffff;
        
                }

                .navigation a:hover::after, .navigation a.active::after
                {
                    transform: scaleX(1.4);
                }

                .hero
                {
                    min-height: 600px;
                    background: repeating-radial-gradient(circle, #000000 #470505 #000000 #470505);
                    display: flex;
                    align-items: center;
                    justify-content: center;
                }

                .main
                {
                    background: repeating-radial-gradient(circle, #000000 #470505 #000000 #470505);
                }

                .backlay
                {
                    width: 90%;
                    min-height: 60vh;

                    margin: 70px auto;
                    padding: 55px;

                    background:linear-gradient(145deg, #211919 , #151010); 

                    border-radius: 24px;
                    border: 1px solid rgba(140, 35, 35, 0.35);

                    color:#a58b8b;
                    font-size: 54px;

                    position: relative;
                    display: flex;
                    justify-content: space-between;
                    align-items: flex-start;
                    flex-wrap: wrap;
                }
                
                .contact-title
                {
                    width: 100%;
                    font-size: 36px;
                    font-weight: bold;
                    color: #ffffff;
                    margin-bottom: 20px;
                    text-align: center;
                }

                .contant-content
                {
                    width: 100%;
                    display: flex;
                    justify-content: space-between;
                    align-items: stretch;
                    gap: 20px;
                    flex-wrap: wrap;

                    
                }

                .contact-info
                {
                    display: flex;
                    flex-direction: column;
                    
                    font-size: 24px;

                    width: 45%; 
                    
                
                    padding: 30px;
                    
                    background: linear-gradient(145deg, #191313 , #120e0e);
                    border-radius: 24px;
                    border: 1px solid rgba(140, 35, 35, 0.3);

                    text-align: left;
                    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);

                    gap: 30px
                }

                .contact-link
                {
                    display: inline-flex;
                    align-items: center;
                    gap: 10px;

                    margin-bottom: 10px;
                    color: #a58b8b;
                    font-size: 18px;
                    text-decoration: none;
                    transition: transform 0.3s ease, color 0.3s ease;
                }

                .contact-link:hover
                {
                    color: #ffffff;
                    transform: translateY(-4px);
                }

                .contact-link i
                {
                    display: inline-block;
                    font-size: 18px;
                    transition: transform 0.3s ease, color 0.3s ease;
                }

                .contact-link:hover i
                {
                    color: #ffffff;
                }

                .contact-form
                {
                    width: 45%; 
                    padding: 30px;
                    
                    background: linear-gradient(145deg, #191313 , #120e0e);
                    border-radius: 24px;
                    border: 1px solid rgba(140, 35, 35, 0.3);

                    text-align: left;
                    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
                }
                .contact-form h2
                {
                    font-size: 24px;
                    margin-bottom: 8px;
                    color: #ffffff;
                }
                .form-description
                {
                    font-size: 16px;
                    margin-bottom: 25px;
                    color: #a58b8b;
                }

                .form-group
                {
                    display: flex;
                    flex-direction: column;
                    margin-bottom: 20px;
                }

                .form-group label
                {
                    display: block;
                    font-size: 14px;
                    color: #c7aaaa;
                    margin-bottom: 8px;
                }

                .form-group input,
                .form-group textarea
                {
                    width: 100%;
                    padding: 10px;
                    border: 1px solid #8c23234d;
                    border-radius: 4px;
                    background-color: #1a0e0e;
                    color: #ffffff;
                    font-size: 14px;
                }

                .form-group textarea
                {
                    resize: vertical;
                    min-height: 100px;
                }

                .form-group input::placeholder,
                .form-group textarea::placeholder
                {
                    color: #665555;
                }

                .form-group input:focus,
                .form-group textarea:focus
                {
                    border-color: #a83232;
                    box-shadow: 0 0 8px rgba(168, 50, 50, 0.2);
                }

                .contact-form button
                {
                    display:flex;
                    justify-content: center;
                    align-items: center;
                    gap: 10px;

                   /* width: 100%;*/
                    padding: 13px;

                    background: linear-gradient(90deg, #792020,#a83232);
                    border-radius: 9px;

                    color: #ffffff;
                    font-size: 16px;
                    font-weight: 600;

                    cursor: pointer;
                    transition: 0.3s ease;

                   /* padding: 10px 20px;
                    background-color: #a83232;
                    color: #ffffff;
                    border: none;
                    border-radius: 4px;
                    cursor: pointer;
                    transition: background-color 0.3s ease, transform 0.3s ease;
                    */
                }

                .contact-form button:hover
                {
                    background: linear-gradient(90deg, #a83232,#c13b3b);
                    transform: translateY(-2px);
                    box-shadow: 0 5px 15px rgba(168, 50, 50, 0.25);
                }

                .contact-form button i
                {
                   transition: transform 0.3s ease;
                }

                .contact-form button:hover i
                {
                    transform: translateX(5px);
                }

                .form-response
                {

                    position:fixed;
                    bottom: 30px;
                    right: 30px;

                    display: flex;
                    align-items: center;
                    gap: 10px;

                    padding: 15px 22px;
                    background: #191313;
                    color: white;

                    border: 1px solid #8c2323;
                    border-radius: 12px;
                    font-size: 14px;

                    box-shadow: 0 5px 20px rgba(0, 0, 0, 0.4);

                    opacity: 0;
                    visibility: hidden;
                    transform: translateY(20px);

                    transition: 0.3s ease;
                    z-index: 1000;
                }

                .form-response i
                {
                    font-size: 20px ;
                    color: #55c878;
                }

                .form-response.show
                {
                    opacity: 1;
                    visibility: visible;
                    transform: translateY(0);
                }
                

                @media (max-width:1100px)
                    {
                        .navigation
                        {
                            gap: 25px;
                        }
                    }

                    @media (max-width: 767px)
                    {

                        .header
                        {
                            height: 75px;
                        }

                        .logo
                        {
                            left: 5px;
                            top: 0;
                            width: 65px;
                            height: 90px;
                        }

                        .navigation
                        {
                            gap: 12px
                        }

                        .navigation a
                        {
                            font-size:11px ;
                            letter-spacing: 0;
                        }

                        .backlay
                        {
                            width: calc(100% - 24px);
                            min-height: auto;
                            margin: 25px auto;
                            padding: 25px 16px;
                            border-radius: 18px;
                        }

                        .contact-title                        
                        {
                            font-size: 28px;
                            margin-bottom: 20px;
                        }
                        
                        .contact-content
                        {
                            flex-direction: column;
                            align-items: stretch;
                            gap: 20px;
                        }

                        .contact-info, .contact-form
                        {
                            width: 100%;
                            padding: 22px 18px;
                            border-radius: 18px;
                        }

                        .contact-info
                        {
                            gap: 16px;
                            font-size: 16px;
                        }

                        .contact-link
                        {
                            font-size: 14px;
                            gap: 10px;
                            margin-bottom: 0;
                            overflow-wrap: anywhere;
                        }

                        .contact-link i
                        {
                            font-size: 17px;
                            flex-shrink: 0;
                        }

                        .contact-form h2
                        {
                            font-size: 21px;
                        }

                        .form-description
                        {
                            font-size: 14px;
                            margin-bottom: 20px;
                        }

                        .form-group
                        {
                            margin-bottom: 16px;
                        }

                        .form-group input, .form-group textarea
                        {
                            font-size: 16px;
                            padding: 12px;
                        }

                        .contact-form button
                        {
                            width: 100%;
                            min-height: 45px;
                            justify-content: center;
                        }

                        .form-response
                        {
                            left: 15px;
                            bottom: 15px;
                            right: 15px;
                            justify-content: center;
                            text-align: center;
                            padding: 14px 12px;
                            font-size: 13px;
                        }

        




                    }

            </style>
        </head>

        <body class="body">
            <header class="header">
                <div class="header-content">
                    <a href="index.html" class="logo">
                    <img src="slike/logo.png" alt="Mićić">
                    </a>

                    <nav class="navigation">
                    <a href="index.html">Početna</a>
                    <a href="omeni.html">O meni</a>
                    <a href="aplikacije.html">Aplikacije</a>
                    <a href="kontakt.html">Kontakt</a>
                </nav>
                </div>
            </header>

            <main>
            <div class="backlay">
                <div class="contact-title">KONTAKT</div>
                <div class="contant-content">
                    <div class="contact-info">
                        <a href="mailto:filipfilip.micic1@gmail.com" class="contact-link"><i class="fas fa-envelope"></i> Email: filipfilip.micic1@gmail.com</a>
                        <a href="tel:+381691508692" class="contact-link"><i class="fas fa-phone"></i> Telefon: +381691508692</a>
                        <a href="https://www.linkedin.com/in/yourprofile" target="_blank" class="contact-link"><i class="fab fa-linkedin"></i> LinkedIn</a>
                        <a href="https://github.com/FilipMicic" target="_blank" class="contact-link"><i class="fab fa-github"></i> GitHub</a>
                        <a href="https://www.instagram.com/micicc_f" target="_blank" class="contact-link"><i class="fab fa-instagram"></i> Instagram</a>
                    </div>

        
                    
                    <div class="contact-form">

                        <h2>Pošaljite poruku</h2>
                        <p class="form-description">Popunite obrazac ispod kako biste me kontaktirali.</p>
                        <form action="https://formspree.io/f/xljbwbeo" method="post">

                            <div class="form-group">
                                <label for="name">Ime:</label>
                                <input type="text" id="name" name="name" required>
                            </div>

                            <div class="form-group">
                                <label for="email">Email:</label>
                                <input type="email" id="email" name="email" required>
                            </div>

                            <div class="form-group">
                                <label for="message">Poruka:</label>
                                <textarea id="message" name="message" required></textarea>
                            </div>

                            <button type="submit">Pošalji <i class="fa-solid fa-paper-plane"></i></button>
                        </form>
                        <div id="form-response" class="form-response">
                            <i class="fas fa-check-circle"></i> 
                            Hvala na poruci! Odgovorićemo uskoro.

                        </div>
                    </div>
                </div>
            </div>

            
            </main>

            <script>
                const form = document.querySelector('form');
                const formResponse = document.getElementById('form-response');

                form.addEventListener('submit', function(event) {
                    event.preventDefault();

                    const formData = new FormData(form);

                    fetch(form.action, {
                        method: form.method,
                        body: formData,
                        headers: {
                            'Accept': 'application/json'
                        }
                    }).then(response => {
                        if (response.ok) {
                            formResponse.classList.add('show');
                            form.reset();
                            setTimeout(() => {
                                formResponse.classList.remove('show');
                            }, 5000);
                        } else {
                            response.json().then(data => {
                                if (Object.hasOwn(data, 'errors')) {
                                    alert(data["errors"].map(error => error["message"]).join(", "));
                                } else {
                                    alert("Došlo je do greške prilikom slanja poruke.");
                                }
                            });
                        }
                    }).catch(error => {
                        alert("Došlo je do greške prilikom slanja poruke.");
                    });
                });
            </script>
        </body>
    </html>
