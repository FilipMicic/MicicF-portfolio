<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>
            Filip Micic
        </title>
        <style>
            *
            {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }

            .body
            {
                   background-color: #080808;

                    background-image:
                    radial-gradient(
                        ellipse at 15% 20%,
                        rgba(100, 0, 15, 0.25),
                        transparent 40%
                    ),
                    radial-gradient(
                        ellipse at 85% 80%,
                        rgba(75, 0, 10, 0.2),
                        transparent 40%
                    );

                    min-height: 100vh;

                    padding-top: 85px;
            }

            .header 
            {
                width: 100%;
                height: 85px;

                background: linear-gradient(90deg, #080808 ,#150909, #080808);

                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                z-index: 1000;

                border-bottom: 1px solid #8c23234d;

                box-shadow: 0 5px 25px rgba(0, 0, 0, 0.4);
            }
            .header-content
            {
                max-width: 1200px;
                height: 100%;
                margin: 0 auto;
                padding: 0 20px;

                display: flex;
                align-items: center;
                justify-content: space-between;
            }

            .logo
            {
                position: absolute;
                top:5px;
                left: max(5px, calc((100%-1230px)/2));

                width: 90px;
                height: 120px;

                display: block;
                z-index: 20;


            }
            .logo img {
                width: 100%;
                height: 100%;
                object-fit: contain;
                display: block;
            }
            
            .navigation
            {
                display: flex;
                align-items: center;
                gap: 45px;
                margin-left: auto;
            }

            .navigation a
            {
                position: relative;

                text-decoration: none;
                color: #bdb5b5;

                font-size: 14px;
                font-weight: 500;
                letter-spacing: 0.5px;

                padding: 10px 0;

                background: transparent;

                transition: color 0.3s ease;
            }

            .navigation a::after
            {
                content: '';

                position: absolute;
                left: 0;
                bottom: 0;

                width: 100%;
                height: 2px;

                background: #a52b2b;
                border-radius: 5px;
                
                transition: transform 0.3s ease;
            }

            .navigation a:hover, .navigation a.active
            {
                
                color: #ffffff;
    
            }

            .navigation a:hover::after, .navigation a.active::after
            {
                transform: scaleX(1.4);
            }

            .hero
            {
                    min-height: 600px;
                    background: repeating-radial-gradient(circle, #000000 #470505 #000000 #470505);
                    display: flex;
                    align-items: center;
                    justify-content: center;
            }

           .cards-container
            {
                display: grid;
                grid-template-columns: repeat(3, 1fr);
                gap: 25px;

                width: 100%;
                max-width: 1200px;

                margin: 35px auto 0;
            }

            .backlay
            {
                width: 90%;
                min-height: 70vh;

                margin: 70px auto;
                padding: 55px;

                background: linear-gradient(145deg, #211919 , #151010); 

                border-radius: 24px;
                border: 1px solid rgba(140, 35, 35, 0.35);

               /* backdrop-filter: blur(15px);
                -webkit-backdrop-filter: blur(15px);*/
            
                color:#a58b8b;
                font-size: 54px;

                position: relative;
                display: flex;
                justify-content: center;
                align-items: flex-start;
                flex-wrap: wrap;

            }

            

           /* .Memory
            {
                width: 300px;
                height: 75px;
                background-color: #ffffff;
                display: flex;
                border-radius: 10px;
                border: 1px solid #000000;
                
                align-items: center;
                justify-content: center;
                margin : 0px;
            }
            

            .droper
            {
                width: 300px;
                height: 75px;
                background-color: #ffffff;
                display: flex;
                border-radius: 10px;
                border: 1px solid #000000;

                align-items: center;
                justify-content: center;
                margin : 0px;
            }*/


            .Memory, .droper
            {
                min-height: 160px;
                width: 100%;

                display: flex;
                align-items: center;
                justify-content: center;

                
                background: linear-gradient(
                    145deg,
                    #191313,
                    #100c0c
                );

                background: linear-gradient(
                    145deg,
                    #191313,
                    #100c0c
                );

               
                border-radius: 24px;
                border: 1px solid rgba(140, 35, 35, 0.3);

                

                color: #ffffff;

                text-decoration: none;

                box-shadow: 0 10px 30px rgba(100, 0, 0, 0.25);

                transition: all 0.35s ease;

                cursor: pointer;

                position: relative;
                overflow: hidden;

                

            }

            .Memory::before, .droper::before
            {
                content: '';
                position: absolute;
                inset: 0;
                

                background: radial-gradient(
                    circle at center,
                    rgba(140, 35, 35, 0.16),
                    transparent 70%
                );

                opacity: 0;
                transition: opacity 0.35s ease;
            }
            

            .Memory:hover, .droper:hover
            {
               

                
                transform: translateY(-8px);

                border-color: #a52b2b;
                background: linear-gradient(
                    145deg,
                    #301919,
                    #171010
                );
                box-shadow: 0 15px 35px rgba(100, 0, 0, 0.2);
            }

            .Memory:hover::before, .droper:hover::before
            {
                opacity: 1;
            }

            .Memory h1, .droper h1
            {
                position: relative;
                z-index: 1;

                font-size: 27px;
                font-weight: 700;
                letter-spacing: 3px;
                color:#ffffff;
                transition: all 0.35s ease;
            }

            .Memory:hover h1, .droper:hover h1
            {
                color: #e45b5b;
                letter-spacing: 4px;
            }

            @media (max-width: 1100px) {
                .cards-container
                {
                    grid-template-columns: repeat(2, 1fr);
                }
                
            }

            @media (max-width: 767px) {
                .cards-container
                {
                    grid-template-columns: 1fr;
                    max-width: 400px;
                    margin-top: 50px;
                }
                .backlay
                {
                    padding: 30px 20px;
                }
               
            }

            .Memory:hover h1, .droper:hover h1
            {
                color: #e45b5b;
            }

            .background-text
            {

                width: 100%;
                font-size: 36px;
                font-weight: 800;
                letter-spacing: 4px;
                color: #ffffff;
                text-align: left;

                padding-bottom: 18px;
                border-bottom: 1px solid rgba(140, 35, 35, 0.35);

                position: relative; 
              /*  position: absolute;

                top: 30px;
                right: 40px;

                font-size: 100px;
                font-weight: 900;

                color: rgba(255, 255, 255, 0.025);
                text-transform: uppercase;
                letter-spacing: 10px;
                pointer-events: none;
                user-select: none;*/
            }

            .background-text::after
            {
                content: '';
                position: absolute;
                bottom: -1px;
                left: 0;

                width: 100%;
                height: 2px;

                background:#a52b2b;
                border-radius: 5px;

            }

              @media (max-width:1100px)
                {
                    .navigation
                    {
                        gap: 25px;
                    }

                    .background-text
                    {
                    font-size:32px
                    }
                }

                @media (max-width: 767px)
                {

                    .header
                    {
                        height: 75px;
                    }

                    .logo
                    {
                        left: 5px;
                        top: 0;
                        width: 65px;
                        height: 90px;
                    }

                    .navigation
                    {
                        gap: 12px
                    }

                    .navigation a
                    {
                        font-size:11px ;
                        letter-spacing: 0;
                    }

                     .background-text
                    {
                    font-size: 24px;
                    letter-spacing: 2px;
                    padding-bottom: 12px;
                    }

                    .cards-container
                    {
                        position:relative;
                        z-index: 6;
                    }
                }
            

        </style>

        </main>

</html>
