<!DOCTYPE html>
<html>
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;500;600;700&display=swap" rel="stylesheet">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>
            Filip Micic
        </title>
        <style>
            *
            {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }

            .body
            {
                background-color: #ffffff;
            }

            .header 
            {
                width: 100%;
                height: 85px;

                background: linear-gradient(90deg, #080808 ,#150909, #080808);

                position: relative;
                z-index: 10;

                border-bottom: 1px solid #8c23234d;

                box-shadow: 0 5px 25px rgba(0, 0, 0, 0.4);
            }
            .header-content
            {
                max-width: 1200px;
                height: 100%;
                margin: 0 auto;
                padding: 0 20px;

                display: flex;
                align-items: center;
                justify-content: space-between;
            }

            .logo
            {
                position: absolute;
                top:5px;
                left: max(5px, calc((100%-1230px)/2));

                width: 90px;
                height: 120px;

                display: block;
                z-index: 20;


            }
            .logo img {
                width: 100%;
                height: 100%;
                object-fit: contain;
                display: block;
            }
            
            .navigation
            {
                display: flex;
                align-items: center;
                gap: 45px;
                margin-left: auto;
            }

            .navigation a
            {
                position: relative;

                text-decoration: none;
                color: #bdb5b5;

                font-size: 14px;
                font-weight: 500;
                letter-spacing: 0.5px;

                padding: 10px 0;

                background: transparent;

                transition: color 0.3s ease;
            }

            .navigation a::after
            {
                content: '';

                position: absolute;
                left: 0;
                bottom: 0;

                width: 100%;
                height: 2px;

                background: #a52b2b;
                border-radius: 5px;
                
                transition: transform 0.3s ease;
            }

            .navigation a:hover, .navigation a.active
            {
                
                color: #ffffff;
    
            }

            .navigation a:hover::after, .navigation a.active::after
            {
                transform: scaleX(1.4);
            }

            .hero
            {
                min-height: 600px;
                background: repeating-radial-gradient(circle, #000000 #470505 #000000 #470505);
                display: flex;
                align-items: center;
                justify-content: center;
            }

            .hero
            {
                width: 100%;
                min-height: 650px;
                padding: 70px 6%;

                display: flex;
                align-items: center;
                justify-content: space-between;
                gap: 60px;

                background-color: #ffffff;
            }

            .hero-content
            {
                flex:1;
                max-width: 500px;
            }

            .hero-label
            {
                font-family: Arial, sans-serif;
                font-size: 11px;
                letter-spacing: 3px;
                color: #000000;
                margin-bottom: 35px;
            }

            .hero-content h1
            {
                font-family: 'Dancing Script', cursive;
                font-size: clamp(42px, 5vw, 68px);
                font-weight: 500;
                line-height: 1.3;
                color: #470505
            }

            .hero-author
            {
                font-family: Arial, sans-serif;
                font-size: 13px;
                letter-spacing: 3px;
                color: #000000;
                margin-bottom: 35px;
            }



            .hero-image
            {
                flex: 1.2;
                height: 520px;
                overflow: hidden;
                border-radius: 10px;
                border-color: #000000;
            }

            .hero-image img
            {
                width: 100%;
                height: 100%;
                object-fit: cover;
                display: block;
            }


        </style>
    </head>

    <body class="body">
        <header class="header">
            <div class="header-content">
                <a href="#" class="logo">
                   <img src="slike/logo.png" alt="Mićić">
                </a>

                <nav class="navigation">
                <a href="#">Početna</a>
                <a href="omeni.html">O meni</a>
                <a href="aplikacije.html">Aplikacije</a>
                <a href="kontakt.html">Kontakt</a>
            </nav>
            </div>
        </header>

        <section class="hero">
         
            <div class="hero-content">

                <p class="hero-label">INSPIRACIJA ZA SVAKI DAN</p>

                <h1 id="citat-tekst">
                </h1>

                <span class="hero-author" id="citat-autor"></span>

            </div>
           
            <div class="hero-image">
                <img id="citat-img" src="" alt="MOTIVISI SE">
            </div>
        </section>
        <script>
    async function loadRandomQuote() {
        try
        {
            const response = await fetch("citati.json");
            const quotes = await response.json();

            const randomIndex = Math.floor(Math.random()*quotes.length);
            const selectedQuote = quotes[randomIndex];

            document.getElementById("citat-tekst").textContent=  `"${selectedQuote.quote}"`;

            document.getElementById("citat-autor").textContent = "——" + selectedQuote.author;

            document.getElementById("citat-img").src = selectedQuote.image;
        }catch(error)
        {
            console.error("Greska pri ucitavanju:",error);
        }
    }

        loadRandomQuote();
</script>
    </body>
</html>
