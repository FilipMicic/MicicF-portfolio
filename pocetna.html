    <!DOCTYPE html>
    <html>
        <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;500;600;700&display=swap" rel="stylesheet">
        <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>
                Filip Micic
            </title>
            <style>
                *
                {
                    margin: 0;
                    padding: 0;
                    box-sizing: border-box;
                }

                .body
                {
                    background-color: #080808;

                        background-image:
                        radial-gradient(
                            ellipse at 15% 20%,
                            rgba(100, 0, 15, 0.25),
                            transparent 40%
                        ),
                        radial-gradient(
                            ellipse at 85% 80%,
                            rgba(75, 0, 10, 0.2),
                            transparent 40%
                        );

                        min-height: 100vh;
                }

                .header 
                {
                    width: 100%;
                    height: 85px;

                    background: linear-gradient(90deg, #080808 ,#150909, #080808);

                    position: relative;
                    z-index: 10;

                    border-bottom: 1px solid #8c23234d;

                    box-shadow: 0 5px 25px rgba(0, 0, 0, 0.4);
                }
                .header-content
                {
                    max-width: 1200px;
                    height: 100%;
                    margin: 0 auto;
                    padding: 0 20px;

                    display: flex;
                    align-items: center;
                    justify-content: space-between;
                }

                .logo
                {
                    position: absolute;
                    top:5px;
                    left: max(5px, calc((100%-1230px)/2));

                    width: 90px;
                    height: 120px;

                    display: block;
                    z-index: 20;


                }
                .logo img {
                    width: 100%;
                    height: 100%;
                    object-fit: contain;
                    display: block;
                }
                
                .navigation
                {
                    display: flex;
                    align-items: center;
                    gap: 45px;
                    margin-left: auto;
                }

                .navigation a
                {
                    position: relative;

                    text-decoration: none;
                    color: #bdb5b5;

                    font-size: 14px;
                    font-weight: 500;
                    letter-spacing: 0.5px;

                    padding: 10px 0;

                    background: transparent;

                    transition: color 0.3s ease;
                }

                .navigation a::after
                {
                    content: '';

                    position: absolute;
                    left: 0;
                    bottom: 0;

                    width: 100%;
                    height: 2px;

                    background: #a52b2b;
                    border-radius: 5px;
                    
                    transition: transform 0.3s ease;
                }

                .navigation a:hover, .navigation a.active
                {
                    
                    color: #ffffff;
        
                }

                .navigation a:hover::after, .navigation a.active::after
                {
                    transform: scaleX(1.4);
                }

                .hero
                {
                    min-height: 70vh;
                    width:95%;

                    margin: 70px auto;
                    
                    background: linear-gradient(145deg, #211919 , #151010); 
                    display: flex;
                    align-items: center;
                    justify-content: center;
                
                    
                    padding: 55px;
                    border-radius: 24px;
                    border: 1px solid rgba(140, 35, 35, 0.35);

                    display: flex;
                    align-items: center;
                    justify-content: space-between;
                    gap: 60px;


                }

                .hero-content
                {
                    flex:1;
                    max-width: 500px;
                }

                .hero-label
                {
                    font-family: Arial, sans-serif;
                    font-size: 11px;
                    letter-spacing: 3px;
                    color: #a58b8b;
                    margin-bottom: 35px;
                }

                .hero-content h1
                {
                    font-family: 'Dancing Script', cursive;
                    font-size: clamp(42px, 5vw, 68px);
                    font-weight: 500;
                    line-height: 1.3;
                    color: #e8caca;
                }

                .hero-author
                {
                    font-family: Arial, sans-serif;
                    font-size: 13px;
                    letter-spacing: 3px;
                    color: #a58b8b;
                    margin-bottom: 35px;
                }



                .hero-image
                {
                    flex: 1.2;
                    height: 520px;
                    overflow: hidden;
                    border-radius: 18px;
                    border: 1px solid rgba(165, 43, 43, 0.4);
                    
                }

                .hero-image img
                {
                    width: 100%;
                    height: 100%;
                    object-fit: cover;
                    display: block;
                    transition: transform 0.5s ease;
                }
                .hero-image img:hover
                {
                    transform: scale(1.05);
                }

                @media (max-width: 800px)
                {
                    .hero
                    {
                        width: 90%;
                        flex-direction: column;
                        gap: 40px;
                        padding: 35px;
                    }

                    .hero-image
                    {
                        height: 350px;
                        width: 100%;
                    }
                    .hero-content
                    {
                        max-width: 100%;
                        width: 100%;
                    }
                }

                .donja-traka
                {
                    width: 95%;
                    margin: 0 auto 70px auto;
                    display: flex;
                    gap: 30px;
                }

                .recomended, .addition
                {
                    flex: 1;
                    min-height: 40vh;
                    
                    background: linear-gradient(145deg, #211919 , #151010);
                    
                    display: flex;
                    align-items: center;
                    justify-content: center;
                
                    
                    padding: 55px;
                    border-radius: 24px;
                    border: 1px solid rgba(140, 35, 35, 0.35);

                }
              /*  .addition
                {
                    
                    position: absolute;
                    right: 35px;
                    
                }

                .recomended
                {
                    position:absolute;
                    left: 35px;
                }
  */

                @media (max-width: 800px)
                {
                    .donja-traka
                    {
                        width: 90%;
                        flex-direction: column;
                    }
                }

                @keyframes fadeIn
                {
                    from {opacity: 0; transform: translateY(10px);}
                    to {opacity: 1; transform: translateY(0);}
                }

                .hero-content, .hero-image
                {
                    animation: fadeIn 0.8s ease-out;
                }


            </style>
        </head>

        <body class="body">
            <header class="header">
                <div class="header-content">
                    <a href="pocetna.html" class="logo">
                    <img src="slike/logo.png" alt="Mićić">
                    </a>

                    <nav class="navigation">
                    <a href="pocetna.html" class="active">Početna</a>
                    <a href="omeni.html">O meni</a>
                    <a href="aplikacije.html">Aplikacije</a>
                    <a href="kontakt.html">Kontakt</a>
                </nav>
                </div>
            </header>

            <div class="hero">
            
                <div class="hero-content">

                    <p class="hero-label">INSPIRACIJA ZA SVAKI DAN</p>

                    <h1 id="citat-tekst">
                    </h1>

                    <span class="hero-author" id="citat-autor"></span>

                </div>
            
                <div class="hero-image">
                    <img id="citat-img" src="" alt="MOTIVISI SE">
                </div>
                
            </div>

            <div class="donja-traka">
            <div class="recomended">
            AAAAAAAA        
            </div>
            <div class="addition">
                AAAAAABBBBB
            </div>
            </div>
            
            <script>
        async function loadRandomQuote() {
            try
            {
                const response = await fetch("citati.json");
                const quotes = await response.json();

                const randomIndex = Math.floor(Math.random()*quotes.length);
                const selectedQuote = quotes[randomIndex];

                document.getElementById("citat-tekst").textContent=  `"${selectedQuote.quote}"`;

                document.getElementById("citat-autor").textContent = "——" + selectedQuote.author;

                document.getElementById("citat-img").src = selectedQuote.image;
            }catch(error)
            {
                console.error("Greska pri ucitavanju:",error);
            }
        }

            loadRandomQuote();
    </script>
        </body>
    </html>
