<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
        <link rel="stylesheet" href="css/auth.css">
        <link rel="stylesheet" href="css/style.css">
        <title>
            Resetovanje lozinke - Filip Micic
        </title>
     
    </head>

    <body class="body">
     <div class="scroll-progress" id="scroll-progress"></div>
        <header class="header">
            <div class="header-content">
                <a href="index.html" class="logo">
                   <img src="slike/logo.png" alt="Mićić">
                </a>

                <nav class="navigation">
                <a href="index.html">Početna</a>
                <a href="omeni.html">O meni</a>
                <a href="aplikacije.html">Aplikacije</a>
                <a href="kontakt.html">Kontakt</a>
            </nav>
            </div>
        </header>

        <main class="auth-main">
            <a href="index.html" class="back-home"><i class="fas fa-arrow-left"></i> Povratak na prijavu</a>    

            <div class="auth-container register-container">
                <div class="auth-image">
                    <i class="fas fa-user-lock"></i>
                </div>

                <h1>Resetujte <span>lozinku!</span></h1>
                <p class="subtitle" >Unesite i potvrdite vašu novu lozinku.</p>

                <div id="authMessage" class="auth-message" role="alert" aria-live="polite">
                    <i class="fas fa-exclamation-circle"></i>
                    <span></span>
                </div>

                <form id="forgotPasswordForm">
                    <div class="input-group">
                        <label for="newPassword">Nova lozinka</label>
                        <div class="input-box">
                            <i class="fas fa-lock"></i>
                            <input type="password" id="newPassword" placeholder="Unesite novu lozinku" minlength="8" required>
                            <i class="fas fa-eye toggle-password"></i>
                        </div>
                    </div>
                    <div class="input-group">
                        <label for="confirmPassword">Potvrdite lozinku</label>
                        <div class="input-box">
                            <i class="fas fa-lock"></i>
                            <input type="password" id="confirmPassword" placeholder="Potvrdite novu lozinku" minlength="8" required>
                            <i class="fas fa-eye toggle-password"></i>
                        </div>
                    </div>
                    <button type="submit" class="auth-btn">Resetuj lozinku</button>
                </form>

                <div class="auth-switch">
                    <p>Setili ste se lozinke? <a href="login.html">Prijavite se</a></p>
                </div>
            </div>
            
        </main>
        <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
        <script src="js/supabase.js"></script>
        <script src="js/auth.js"></script>
        <script src="js/script.js"></script>
    </body>
</html>
